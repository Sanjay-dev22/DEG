        - generic [ref=e1168]: SETTLED
      - generic [ref=e1170]: "Delivered: 9.86 kW · Settlement: Rs -12.994"
      - generic [ref=e1171]:
        - generic [ref=e1172] [cursor=pointer]: init
        - generic [ref=e1173] [cursor=pointer]: on_init
        - generic [ref=e1174] [cursor=pointer]: confirm
        - generic [ref=e1175] [cursor=pointer]: on_confirm
        - generic [ref=e1176] [cursor=pointer]: on_status
      - generic [ref=e1177]:
        - generic [ref=e1178]:
          - generic [ref=e1179]: How the 62.74 kW offer was derived (live fleet snapshot at enrollment)
          - text: 28 of 40 subscribers were actually connected at the moment of enrollment -- 15 of them picked for this pool, totalling 100.1 kW of real rated charger capacity. mean = (sum of each selected charger's own rated kW) x 85% follow-through = 100.1 x 0.85 = 85.09 kW std = sqrt(sum of each charger's kW^2 x p x (1-p)) = 9.61 kW safe = mean - 2.326 x std = 85.09 - 2.326 x 9.61 = 62.74 kW (99% confidence) (TPDDL originally asked for 120 kW)
        - generic [ref=e1180]:
          - generic [ref=e1181]: The real settlement math
          - text: delivered = 9.86 kW (sum of baseline-usage, reported by TPDDL's real meters) eligible = min(delivered, offered) = min(9.86, 62.74) = 9.86 kW pay = eligible x 0.5h x Rs3.8/kWh = Rs18.73 penalty = max(0, offered-delivered) x 0.5h x Rs1.2/kWh = Rs31.73 net (GreenFlex vs TPDDL) = Rs18.73 - Rs31.73 = Rs-13 subscribers are paid from the Rs18.73 gross pay only, by their own delivered share -- GreenFlex itself absorbs the Rs31.73 penalty, not the people who actually delivered.
