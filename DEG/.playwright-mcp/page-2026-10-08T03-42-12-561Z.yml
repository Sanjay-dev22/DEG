      - generic [ref=f2e675]:
        - generic [ref=f2e676]:
          - generic [ref=f2e677]: How the 36.52 kW offer was derived (live fleet snapshot at enrollment)
          - text: 28 of 40 subscribers were actually connected at the moment of enrollment -- 9 of them picked for this pool, totalling 64.7 kW of real rated charger capacity. mean = (sum of each selected charger's own rated kW) x 85% follow-through = 64.7 x 0.85 = 55 kW std = sqrt((sum of each charger's rated kW, squared) x 0.85 x 0.15) = sqrt(494.85 x 0.85 x 0.15) = 7.94 kW safe = mean - 2.326 x std = 55 - 2.326 x 7.94 = 36.52 kW (99% confidence) (TPDDL originally asked for 80 kW)
        - generic [ref=f2e678]:
          - generic [ref=f2e679]: The real settlement math
          - text: delivered = 9.48 kW (sum of baseline-usage, reported by TPDDL's real meters) eligible = min(delivered, offered) = min(9.48, 36.52) = 9.48 kW pay = eligible x 0.5h x Rs3.5/kWh = Rs16.59 penalty = max(0, offered-delivered) x 0.5h x Rs1.5/kWh = Rs20.28 net (GreenFlex vs TPDDL) = Rs16.59 - Rs20.28 = Rs-3.69 subscribers are paid from the Rs16.59 gross pay only, by their own delivered share -- GreenFlex itself absorbs the Rs20.28 penalty, not the people who actually delivered.
      - generic [ref=f2e680]:
        - generic [ref=f2e681]: Real per-subscriber payout -- split from the gross pay only, by actual delivered kWh (never the net settlement, so a shortfall penalty never reduces what a performing subscriber earns)
