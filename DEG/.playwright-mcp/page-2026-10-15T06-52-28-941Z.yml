    - generic [ref=f2e38]:
      - heading "What this demo simplifies (on purpose)" [level=2] [ref=f2e39]
      - list [ref=f2e40]:
        - listitem [ref=f2e41]: Reuses sellerapp.example.com's already-registered signing identity (same keys as onix-sellerapp) for onix-aggregatorapp rather than registering a brand-new, distinct network participant — that step needs real DeDi registration + namespace-owner approval, out of scope for this demo. Routing is genuinely separate (own container, own catalog, own lifecycle); only the underlying signing identity is shared.
        - listitem [ref=f2e42]: Incoming requirements are matched with a simple cheapest-first greedy fill up to the requested quantity (capped by the price ceiling), not a true constrained optimization.
        - listitem [ref=f2e43]: Pools once, at publish time — no re-aggregation as individual sellers' availability changes mid-window.
        - listitem [ref=f2e44]: Disaggregates the block's one real delivered-quantity reading proportionally across members (no per-member smart meter in this demo) — a real deployment would use each member's own real meter reading, per the 'virtual meter' reconciliation approach the real IES implementation guide describes.
        - listitem [ref=f2e45]: Grid/DISCOM (grid-app) only posts a requirement — the real discover/buy/confirm for the resulting block is still executed by buyer-app. Giving Grid/DISCOM its own onix identity to buy directly is a clean later phase, not built here.
